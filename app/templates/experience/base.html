<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19130f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>{% block title %}Celebrate with us · Adlin &amp; Prithvi{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ asset_url('images/favicon.png') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ asset_url('css/photo-drop.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/guest-experience.css') }}">
  <script src="{{ asset_url('js/guest-experience.js') }}" defer></script>
</head>
<body class="photo-drop-page experience-page">
  <div class="photo-drop-backdrop" aria-hidden="true"></div>
  <main class="experience-wrap">
    <header class="photo-drop-header">
      <p class="photo-drop-overline">THE WEDDING WEEKEND · NOVEMBER 2026</p>
      <p class="photo-drop-signature">Adlin <span>&amp;</span> Prithvi</p>
      <div class="photo-drop-header-rule" aria-hidden="true"><span>✦</span></div>
    </header>
    {% include 'experience/navigation.html' %}
    {% block content %}{% endblock %}
    <footer class="experience-footer">
      <span>Made with love, for the people we love.</span>
      <button type="button" class="experience-effects" data-solid-controls hidden aria-pressed="false">Solid controls</button>
    </footer>
  </main>
</body>
</html>
