
name: Wedding V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: wedding-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q app tests wsgi.py

      - name: Run automated tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Install Playwright browser test framework
        run: python -m pip install playwright==1.56.0

      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Execute real-browser guest regression suite
        run: python -m pytest -q -p no:cacheprovider tests/browser
